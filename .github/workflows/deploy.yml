# ==============================================================
# Global HL7 FHIR Learning Lab — Explicit Production Release Only
# A main merge never dispatches this workflow.
# ==============================================================
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan deploy manual'
        required: true
        default: 'Explicit production deployment request'
      expected_sha:
        description: 'Approved full main commit SHA; dispatch fails if main moved'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fhir-production
  cancel-in-progress: false

jobs:
  canonical-ci:
    name: Verify canonical CI for dispatched SHA
    runs-on: [self-hosted, macbook-m1]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful main CI for exactly github.sha
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') {
              throw new Error('Production requires an explicit workflow_dispatch on main.');
            }
            const expectedSha = context.payload.inputs?.expected_sha;
            if (typeof expectedSha !== 'string' || !/^[0-9a-f]{40}$/.test(expectedSha)) {
              throw new Error('expected_sha must be a full lowercase 40-character Git SHA.');
            }
            if (context.sha !== expectedSha) {
              throw new Error('Dispatched main SHA does not match the approved SHA; main advanced before dispatch. Review and explicitly authorize a new release.');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci-gate.yml', branch: 'main', event: 'push',
              head_sha: context.sha, per_page: 100,
            });
            const run = runs.filter(r => r.head_sha === context.sha && r.head_branch === 'main' && r.event === 'push')
              .sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`Latest canonical main CI for dispatched SHA ${context.sha} must be completed/successful; retry dispatch after CI finishes.`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id,
              filter: 'latest', per_page: 100,
            });
            const gate = jobs.filter(j => j.name === 'CI Gate: Security, Rules, Tests & Build');
            if (gate.length !== 1 || gate[0].status !== 'completed' || gate[0].conclusion !== 'success') {
              throw new Error('The stable canonical CI job is missing, ambiguous, skipped, or unsuccessful.');
            }
            core.summary.addHeading('Canonical release gate').addRaw(`SHA: ${context.sha}\nCI: ${run.html_url}`).write();

  build-and-deploy:
    name: Build & Deploy Production Assets
    needs: canonical-ci
    runs-on: [self-hosted, macbook-m1]
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 1. Checkout exact dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 2. Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: 3. Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 4. Install Dependencies
        run: bun install --frozen-lockfile

      - name: 5. Build Production Bundle
        run: bun run build

      - name: 6. Deploy to Cloudflare Pages (if credentials provided)
        uses: cloudflare/wrangler-action@v3
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=projects-fhir --branch=main
