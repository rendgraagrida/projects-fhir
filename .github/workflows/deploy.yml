# ==============================================================
# Global HL7 FHIR Learning Lab — Production Deployment Workflow
# Deploys compiled static SPA bundle to Cloudflare Pages
# ==============================================================
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan deployment manual'
        required: false
        default: 'Manual production deployment'
  push:
    branches: [ main ]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 2. Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: 3. Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 4. Install Dependencies
        run: bun install --frozen-lockfile

      - name: 5. Build Production Bundle
        run: bun run build

      - name: 6. Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=projects-fhir --branch=main
