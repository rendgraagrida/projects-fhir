server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high-performance SPA delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/wasm
        image/svg+xml;

    # Explicit MIME types for WebAssembly & PGlite PostgreSQL WASM
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream data;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing fallback (redirect all routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long-term immutable caching
    location ~* \.(js|css|wasm|data|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
